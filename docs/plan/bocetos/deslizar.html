<title>Bocetos de deslizar canciones</title>
<style>
  /* Layout: one column per style (A, B, C), each with mini player, big player and list row */
  :root {
    color-scheme: dark;
    --bg: #14110f;
    --panel: #1d1916;
    --mini: #2a221c;
    --text: #f4ede5;
    --muted: #b6a99b;
    --border: #3a312a;
    --accent: #f2a93b;
    --ink: #2a1702;
    --font: 'Inter', system-ui, sans-serif;
    --head: 'Space Grotesk', var(--font);
  }
  html {
    background: var(--bg);
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
  }
  .wrap {
    max-width: 1080px;
    margin: 0 auto;
    padding-block: 24px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  h1,
  h2 {
    font-family: var(--head);
    margin: 0;
  }
  h1 {
    font-size: 24px;
  }
  h2 {
    font-size: 18px;
    color: var(--accent);
  }
  p {
    color: var(--muted);
    line-height: 1.5;
    margin: 6px 0 0;
    max-width: 65ch;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
    gap: 20px;
    margin-top: 22px;
  }
  .col {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-width: 0;
  }
  .label {
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    margin-top: 8px;
  }
  .swipe {
    position: relative;
    overflow: hidden;
    touch-action: pan-y;
    cursor: grab;
    user-select: none;
    border-radius: 12px;
    background: var(--mini);
  }
  .swipe:active {
    cursor: grabbing;
  }
  .swipe:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .track {
    display: flex;
    align-items: center;
    gap: 10px;
    position: relative;
    z-index: 1;
  }
  .mini {
    height: 64px;
  }
  .mini .track {
    height: 100%;
    padding: 0 10px;
  }
  .row {
    height: 56px;
    background: var(--bg);
  }
  .row .track {
    height: 100%;
    padding: 0 8px;
  }
  .big {
    height: 330px;
  }
  .big .track {
    flex-direction: column;
    justify-content: center;
    height: 100%;
    text-align: center;
  }
  .art {
    width: 44px;
    height: 44px;
    border-radius: 8px;
    flex: none;
    display: grid;
    place-items: center;
    font-size: 20px;
    color: var(--ink);
  }
  .row .art {
    width: 40px;
    height: 40px;
  }
  .big .art {
    width: 200px;
    height: 200px;
    border-radius: 18px;
    font-size: 84px;
  }
  .meta {
    min-width: 0;
    flex: 1;
  }
  .big .meta {
    flex: none;
  }
  .meta b {
    display: block;
    font-size: 14px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .meta span {
    font-size: 12px;
    color: var(--muted);
  }
  .big .meta b {
    font-size: 18px;
  }
  .a1 {
    background: linear-gradient(135deg, #f2a93b, #a8640c);
  }
  .a2 {
    background: linear-gradient(135deg, #ffd79a, #c27410);
  }
  .a3 {
    background: linear-gradient(135deg, #c98b4a, #5c3a17);
    color: #f4ede5;
  }
  /* A: neighbour slides in following the finger */
  .ghost {
    position: absolute;
    inset: 0;
    z-index: 1;
  }
  /* B: growing ring */
  .ring {
    position: absolute;
    top: 50%;
    width: 46px;
    height: 46px;
    margin-top: -23px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    z-index: 2;
    opacity: 0;
    pointer-events: none;
  }
  .ring i {
    position: absolute;
    inset: 4px;
    border-radius: 50%;
    background: var(--mini);
  }
  .ring.full i {
    background: var(--accent);
  }
  .ring svg {
    position: relative;
    width: 20px;
    height: 20px;
    fill: var(--accent);
  }
  .ring.full svg {
    fill: var(--ink);
  }
  /* C: soft edge glow with the other title */
  .glow {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 70%;
    opacity: 0;
    display: flex;
    align-items: center;
    padding: 0 12px;
    font-size: 12px;
    font-weight: 600;
    pointer-events: none;
    z-index: 2;
  }
  .glow.next {
    right: 0;
    justify-content: flex-end;
    background: linear-gradient(to left, #a8640c 15%, transparent);
  }
  .glow.prev {
    left: 0;
    justify-content: flex-start;
    background: linear-gradient(to right, #a8640c 15%, transparent);
  }
  .hint {
    font-size: 12px;
    color: var(--muted);
  }
</style>
<div class="wrap">
  <h1>Tres formas de deslizar canciones</h1>
  <p>
    Arrastra con el dedo o el ratón (también con las flechas del teclado). En reproductores:
    izquierda es siguiente y derecha es anterior. En la lista: derecha añade a la cola, como ahora.
    Los dibujos de las portadas son de ejemplo.
  </p>
  <div class="grid" id="grid"></div>
</div>
<script>
  const songs = [
    { t: 'Luz de tarde', a: 'Los Faroles', c: 'a1', i: '♪' },
    { t: 'Itsasoa', a: 'Haizea', c: 'a2', i: '♫' },
    { t: 'Carretera norte', a: 'Banda Sur', c: 'a3', i: '♬' },
  ];
  const styles = [
    {
      id: 'A',
      name: 'A · Carrusel',
      text: 'La otra canción entra siguiendo el dedo. Recomendada.',
    },
    {
      id: 'B',
      name: 'B · Círculo con icono',
      text: 'Un círculo crece y se rellena cuando ya puedes soltar.',
    },
    {
      id: 'C',
      name: 'C · Fondo suave',
      text: 'Un degradado en el borde con el nombre de la otra canción.',
    },
  ];
  const icons = {
    next: 'M6 5l9 7-9 7zM16 5h3v14h-3z',
    prev: 'M18 5l-9 7 9 7zM5 5h3v14H5z',
    queue: 'M4 6h12v2H4zm0 5h8v2H4zm0 5h8v2H4zm13-5h2v3h3v2h-3v3h-2v-3h-3v-2h3z',
  };
  const trackHtml = (s) =>
    `<div class="art ${s.c}">${s.i}</div><div class="meta"><b>${s.t}</b><span>${s.a}</span></div>`;

  function surface(style, kind) {
    const el = document.createElement('div');
    el.className = 'swipe ' + kind;
    el.tabIndex = 0;
    el.setAttribute('role', 'group');
    el.setAttribute('aria-label', 'Ejemplo ' + style + ' ' + kind);
    let index = 0,
      start = null,
      dx = 0;
    const isRow = kind === 'row';

    function draw(offset, animate) {
      const w = el.clientWidth || 300;
      const dir = offset < 0 ? 'next' : 'prev';
      const step = isRow || dir === 'next' ? 1 : -1;
      const other = songs[(index + step + songs.length) % songs.length];
      const progress = Math.min(Math.abs(offset) / (w * 0.3), 1);
      el.innerHTML = `<div class="track">${trackHtml(songs[index])}</div>`;
      const cur = el.firstChild;
      const move = style === 'A' ? offset : offset * 0.35;
      cur.style.transform = `translateX(${move}px)`;
      if (animate) cur.style.transition = 'transform .25s ease';
      if (!offset) return;
      if (style === 'A') {
        const ghost = document.createElement('div');
        ghost.className = 'ghost';
        const content = isRow
          ? { t: 'Añadir a la cola', a: songs[index].t, c: songs[index].c, i: '+' }
          : other;
        ghost.innerHTML = `<div class="track">${trackHtml(content)}</div>`;
        ghost.style.transform = `translateX(${offset + (offset < 0 ? w : -w)}px)`;
        cur.style.opacity = 1 - progress * 0.5;
        el.appendChild(ghost);
      } else if (style === 'B') {
        const ring = document.createElement('div');
        ring.className = 'ring' + (progress === 1 ? ' full' : '');
        ring.style.opacity = Math.min(progress * 1.5, 1);
        ring.style[offset < 0 ? 'right' : 'left'] = '14px';
        ring.style.transform = `scale(${0.6 + progress * 0.4})`;
        ring.style.background = `conic-gradient(var(--accent) ${progress * 360}deg, var(--border) 0)`;
        ring.innerHTML = `<i></i><svg viewBox="0 0 24 24"><path d="${icons[isRow ? 'queue' : dir]}"/></svg>`;
        el.appendChild(ring);
      } else {
        const glow = document.createElement('div');
        glow.className = 'glow ' + dir;
        glow.style.opacity = progress;
        glow.textContent = isRow ? '+ A la cola' : dir === 'next' ? other.t + ' ›' : '‹ ' + other.t;
        el.appendChild(glow);
      }
    }

    function release() {
      const w = el.clientWidth;
      const passed = Math.abs(dx) > w * 0.3;
      if (passed && !isRow) index = (index + (dx < 0 ? 1 : -1) + songs.length) % songs.length;
      start = null;
      dx = 0;
      draw(0, true);
    }
    const clamp = (v) => (isRow ? Math.max(v, 0) : v);
    el.addEventListener('pointerdown', (e) => {
      start = e.clientX;
      el.setPointerCapture(e.pointerId);
    });
    el.addEventListener('pointermove', (e) => {
      if (start !== null) {
        dx = clamp(e.clientX - start);
        draw(dx);
      }
    });
    el.addEventListener('pointerup', release);
    el.addEventListener('pointercancel', release);
    el.addEventListener('keydown', (e) => {
      if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
      e.preventDefault();
      dx = clamp((e.key === 'ArrowLeft' ? -1 : 1) * el.clientWidth * 0.5);
      draw(dx);
      setTimeout(release, 700);
    });
    el.show = () => draw(clamp((isRow ? 1 : -1) * (el.clientWidth || 300) * 0.4));
    requestAnimationFrame(el.show);
    el.addEventListener('pointerenter', () => {
      if (start === null) draw(0);
    });
    return el;
  }

  for (const s of styles) {
    const col = document.createElement('section');
    col.className = 'col';
    col.innerHTML = `<h2>${s.name}</h2><div class="hint">${s.text}</div>`;
    for (const [kind, label] of [
      ['mini', 'Mini reproductor'],
      ['big', 'Pantalla grande'],
      ['row', 'Fila de una lista'],
    ]) {
      const l = document.createElement('div');
      l.className = 'label';
      l.textContent = label;
      col.append(l, surface(s.id, kind));
    }
    document.getElementById('grid').appendChild(col);
  }
</script>
