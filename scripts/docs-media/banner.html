<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Aske Stream</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 56px;
        background:
          radial-gradient(ellipse 60% 90% at 18% 50%, rgb(242 169 59 / 0.16), transparent 70%),
          #14110f;
        color: #f6efe6;
        font-family: system-ui, 'Segoe UI', Roboto, sans-serif;
      }
      .logo {
        width: 208px;
        height: 208px;
        flex: none;
        border-radius: 46px;
        box-shadow:
          0 0 0 1px rgb(242 169 59 / 0.35),
          0 24px 60px rgb(0 0 0 / 0.55);
      }
      h1 {
        font-size: 92px;
        line-height: 1;
        letter-spacing: -2px;
        font-weight: 750;
      }
      p {
        margin-top: 20px;
        font-size: 31px;
        color: #f2a93b;
      }
      /* The social preview is taller: stack the logo above the text. */
      @media (min-height: 520px) {
        body {
          flex-direction: column;
          gap: 44px;
          text-align: center;
          background:
            radial-gradient(ellipse 60% 60% at 50% 36%, rgb(242 169 59 / 0.17), transparent 70%),
            #14110f;
        }
        p {
          font-size: 38px;
        }
      }
    </style>
  </head>
  <body>
    <!-- Same drawing as apps/web/public/favicon.svg -->
    <svg class="logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" aria-hidden="true">
      <rect width="64" height="64" rx="14" fill="#14110f" />
      <g fill="#f2a93b">
        <rect x="13" y="26" width="6" height="12" rx="3" />
        <rect x="23" y="18" width="6" height="28" rx="3" />
        <rect x="33" y="12" width="6" height="40" rx="3" />
        <rect x="43" y="22" width="6" height="20" rx="3" />
      </g>
    </svg>
    <div>
      <h1>Aske Stream</h1>
      <p>Your music, wherever you choose to keep it.</p>
    </div>
  </body>
</html>
