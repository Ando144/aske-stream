apply plugin: 'com.android.application'

import groovy.json.JsonSlurper

// One version for everything: the root package.json ("0.2.0" -> versionCode 200).
def rootPackage = new JsonSlurper().parse(file('../../../../package.json'))
def appVersion = rootPackage.version as String
def versionParts = appVersion.tokenize('.').collect { it.replaceAll(/\D.*/, '') as int }
def appVersionCode = versionParts[0] * 10000 + versionParts[1] * 100 + versionParts[2]

// Release signing key: from environment variables (GitHub Actions) or from the
// git-ignored .secrets/ folder at the repository root. See docs/android.md.
def secretsDir = file('../../../../.secrets')
def keystoreProps = new Properties()
def keystorePropsFile = new File(secretsDir, 'keystore.properties')
if (keystorePropsFile.exists()) keystorePropsFile.withInputStream { keystoreProps.load(it) }
def signingValue = { String env, String prop -> System.getenv(env) ?: keystoreProps.getProperty(prop) }
def releaseStoreFile = System.getenv('ANDROID_KEYSTORE_FILE') ?:
    (keystoreProps.getProperty('storeFile') ? new File(secretsDir, keystoreProps.getProperty('storeFile')).path : null)

android {
    namespace = "io.github.ando144.askestream"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "io.github.ando144.askestream"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (releaseStoreFile) {
                storeFile file(releaseStoreFile)
                storePassword signingValue('ANDROID_KEYSTORE_PASSWORD', 'storePassword')
                keyAlias signingValue('ANDROID_KEY_ALIAS', 'keyAlias')
                keyPassword signingValue('ANDROID_KEY_PASSWORD', 'keyPassword')
            }
        }
    }
    // yt-dlp runs as a native program: its libraries must be extracted on install.
    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
    // One APK per processor type keeps the download small (Python is ~15 MB per type).
    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a', 'armeabi-v7a'
            universalApk false
        }
    }
    buildTypes {
        release {
            if (releaseStoreFile) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation "io.github.junkfood02.youtubedl-android:library:$youtubedlAndroidVersion"
    implementation "com.google.android.gms:play-services-auth:$playServicesAuthVersion"
    implementation "com.google.android.gms:play-services-code-scanner:$playServicesCodeScannerVersion"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
