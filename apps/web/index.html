<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#14110f" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Aske Stream — your own music cloud." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Aske Stream</title>
    <style>
      /* Opening screen. Inline so it moves before any JavaScript; lib/bootSplash.ts ends it. */
      /* Registered so each bar can animate and transition its own scale. */
      @property --s {
        syntax: '<number>';
        inherits: true;
        initial-value: 1;
      }

      .boot-splash {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: grid;
        place-items: center;
        background: #14110f;
      }

      /* The intro animates `transform` and the exit uses `scale`, so neither overrides the other. */
      .boot-logo {
        width: 96px;
        height: 96px;
        scale: 1;
        animation: boot-logo-in 1200ms cubic-bezier(0.22, 1, 0.36, 1) 0ms both;
      }

      .boot-splash[data-phase='leaving'] {
        opacity: 0;
        pointer-events: none;
        transition: opacity 360ms cubic-bezier(0.4, 0, 0.2, 1);
      }

      .boot-splash[data-phase='leaving'] .boot-logo {
        scale: 1.03;
        transition: scale 360ms cubic-bezier(0.4, 0, 0.2, 1);
      }

      .boot-splash .bar {
        fill: #f2a93b;
      }

      /* Straight middle and two round ends moved apart, so the ends never stretch. */
      .boot-splash .body {
        transform: scaleY(var(--s));
        transform-box: view-box;
        transform-origin: 0 32px;
      }

      .boot-splash .cap-top {
        transform: translateY(calc((1 - var(--s)) * var(--half) * 1px));
      }

      .boot-splash .cap-bottom {
        transform: translateY(calc((var(--s) - 1) * var(--half) * 1px));
      }

      .boot-splash .b1 {
        animation: boot-fill 380ms cubic-bezier(0.33, 1, 0.68, 1) 460ms both;
      }

      .boot-splash .b1 .eq {
        animation: boot-eq-1 1100ms cubic-bezier(0.37, 0, 0.63, 1) 1400ms infinite both;
      }

      .boot-splash .b2 {
        animation: boot-fill 380ms cubic-bezier(0.33, 1, 0.68, 1) 550ms both;
      }

      .boot-splash .b2 .eq {
        animation: boot-eq-2 1300ms cubic-bezier(0.37, 0, 0.63, 1) 1400ms infinite both;
      }

      .boot-splash .b3 {
        animation: boot-fill 380ms cubic-bezier(0.33, 1, 0.68, 1) 640ms both;
      }

      .boot-splash .b3 .eq {
        animation: boot-eq-3 1200ms cubic-bezier(0.37, 0, 0.63, 1) 1400ms infinite both;
      }

      .boot-splash .b4 {
        animation: boot-fill 380ms cubic-bezier(0.33, 1, 0.68, 1) 730ms both;
      }

      .boot-splash .b4 .eq {
        animation: boot-eq-4 1000ms cubic-bezier(0.37, 0, 0.63, 1) 1400ms infinite both;
      }

      /* These two come after the equalizer rules to win over them. */
      .boot-splash .eq.settling {
        animation: none;
        transition: --s 480ms cubic-bezier(0.33, 1, 0.68, 1);
      }

      /* The app is ready: the bars keep their own height from here on. */
      .boot-splash.calm .eq {
        animation: none;
      }

      /* Outline of each bar; the dash length is its perimeter. */
      .boot-splash .trace {
        fill: none;
        stroke: #f2a93b;
        stroke-width: 1.25;
      }

      .boot-splash .t1 {
        stroke-dasharray: 30.85;
        animation:
          boot-trace-1 620ms cubic-bezier(0.65, 0, 0.35, 1) 60ms both,
          boot-trace-out 300ms ease-out 700ms both;
      }

      .boot-splash .t2 {
        stroke-dasharray: 62.85;
        animation:
          boot-trace-2 620ms cubic-bezier(0.65, 0, 0.35, 1) 150ms both,
          boot-trace-out 300ms ease-out 790ms both;
      }

      .boot-splash .t3 {
        stroke-dasharray: 86.85;
        animation:
          boot-trace-3 620ms cubic-bezier(0.65, 0, 0.35, 1) 240ms both,
          boot-trace-out 300ms ease-out 880ms both;
      }

      .boot-splash .t4 {
        stroke-dasharray: 46.85;
        animation:
          boot-trace-4 620ms cubic-bezier(0.65, 0, 0.35, 1) 330ms both,
          boot-trace-out 300ms ease-out 970ms both;
      }

      .boot-splash .glint {
        animation: boot-glint 460ms cubic-bezier(0.37, 0, 0.63, 1) 900ms both;
      }

      @keyframes boot-logo-in {
        from {
          transform: scale(0.96);
        }
        to {
          transform: scale(1);
        }
      }

      @keyframes boot-trace-1 {
        from {
          stroke-dashoffset: 30.85;
        }
        to {
          stroke-dashoffset: 0;
        }
      }

      @keyframes boot-trace-2 {
        from {
          stroke-dashoffset: 62.85;
        }
        to {
          stroke-dashoffset: 0;
        }
      }

      @keyframes boot-trace-3 {
        from {
          stroke-dashoffset: 86.85;
        }
        to {
          stroke-dashoffset: 0;
        }
      }

      @keyframes boot-trace-4 {
        from {
          stroke-dashoffset: 46.85;
        }
        to {
          stroke-dashoffset: 0;
        }
      }

      @keyframes boot-fill {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      @keyframes boot-trace-out {
        from {
          opacity: 1;
        }
        to {
          opacity: 0;
        }
      }

      @keyframes boot-glint {
        from {
          transform: translateX(0);
        }
        to {
          transform: translateX(88px);
        }
      }

      @keyframes boot-eq-1 {
        0%,
        100% {
          --s: 1;
        }
        35% {
          --s: 2.6;
        }
        70% {
          --s: 0.8;
        }
      }

      @keyframes boot-eq-2 {
        0%,
        100% {
          --s: 1;
        }
        40% {
          --s: 0.55;
        }
        75% {
          --s: 1.3;
        }
      }

      @keyframes boot-eq-3 {
        0%,
        100% {
          --s: 1;
        }
        30% {
          --s: 1.1;
        }
        65% {
          --s: 0.6;
        }
      }

      @keyframes boot-eq-4 {
        0%,
        100% {
          --s: 1;
        }
        45% {
          --s: 1.75;
        }
        80% {
          --s: 0.6;
        }
      }
    </style>
  </head>
  <body>
    <!-- Outside #root so React never redraws it and the animation never restarts. -->
    <div
      id="boot-splash"
      class="boot-splash"
      role="status"
      aria-label="Aske Stream"
      data-phase="intro"
    >
      <svg class="boot-logo" viewBox="0 0 64 64" aria-hidden="true">
        <defs>
          <clipPath id="boot-clip">
            <rect x="13" y="26" width="6" height="12" rx="3" />
            <rect x="23" y="18" width="6" height="28" rx="3" />
            <rect x="33" y="12" width="6" height="40" rx="3" />
            <rect x="43" y="22" width="6" height="20" rx="3" />
          </clipPath>
          <linearGradient id="boot-glint-gradient" x1="0" y1="0" x2="1" y2="0.35">
            <stop offset="0" stop-color="#fff3dc" stop-opacity="0" />
            <stop offset="0.5" stop-color="#fff3dc" stop-opacity="0.38" />
            <stop offset="1" stop-color="#fff3dc" stop-opacity="0" />
          </linearGradient>
        </defs>
        <g class="bar b1" style="--half: 3">
          <g class="eq">
            <rect class="body" x="13" y="29" width="6" height="6" />
            <circle class="cap-top" cx="16" cy="29" r="3" />
            <circle class="cap-bottom" cx="16" cy="35" r="3" />
          </g>
        </g>
        <g class="bar b2" style="--half: 11">
          <g class="eq">
            <rect class="body" x="23" y="21" width="6" height="22" />
            <circle class="cap-top" cx="26" cy="21" r="3" />
            <circle class="cap-bottom" cx="26" cy="43" r="3" />
          </g>
        </g>
        <g class="bar b3" style="--half: 17">
          <g class="eq">
            <rect class="body" x="33" y="15" width="6" height="34" />
            <circle class="cap-top" cx="36" cy="15" r="3" />
            <circle class="cap-bottom" cx="36" cy="49" r="3" />
          </g>
        </g>
        <g class="bar b4" style="--half: 7">
          <g class="eq">
            <rect class="body" x="43" y="25" width="6" height="14" />
            <circle class="cap-top" cx="46" cy="25" r="3" />
            <circle class="cap-bottom" cx="46" cy="39" r="3" />
          </g>
        </g>
        <g>
          <rect class="trace t1" x="13" y="26" width="6" height="12" rx="3" />
          <rect class="trace t2" x="23" y="18" width="6" height="28" rx="3" />
          <rect class="trace t3" x="33" y="12" width="6" height="40" rx="3" />
          <rect class="trace t4" x="43" y="22" width="6" height="20" rx="3" />
        </g>
        <g clip-path="url(#boot-clip)">
          <rect
            class="glint"
            x="-24"
            y="0"
            width="24"
            height="64"
            fill="url(#boot-glint-gradient)"
          />
        </g>
      </svg>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
