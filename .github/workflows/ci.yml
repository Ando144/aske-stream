name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history for the secret scan

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Installed only here (--no-save) so package-lock.json stays untouched. It must be the
      # exact version of vitest.
      - name: Coverage tool
        run: npm install --no-save --no-audit --no-fund @vitest/coverage-v8@$(node -p "require('vitest/package.json').version")

      - name: Formatting
        run: npm run format:check

      - name: Typecheck (shared, api, web, ingest)
        run: npm run typecheck

      - name: Unit tests
        run: >-
          npm run test --workspaces --if-present --
          --coverage.enabled --coverage.provider=v8 --coverage.include='src/**/*.{ts,tsx}'
          --coverage.reporter=text-summary --coverage.reporter=json-summary
          --coverage.reporter=html

      - name: Coverage summary
        run: node scripts/coverage-summary.mjs

      - name: Coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          # The exclusion skips packages that ship a folder with the same name.
          path: |
            */*/coverage/
            !node_modules/**
          retention-days: 14

      - name: Script tests
        run: npm run test:scripts

      - name: Docs links
        run: npm run docs:check

      - name: Build PWA
        run: npm run build

      - name: End-to-end API test (wrangler dev + local D1/R2)
        run: npm run test:e2e

      # The CLI scans the full history, so it also works on the very first push
      # (gitleaks-action builds a "<first>^..<last>" range that fails on a root commit).
      - name: Secret scan (gitleaks, full history)
        env:
          GITLEAKS_VERSION: 8.28.0
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks git --config .gitleaks.toml --redact --verbose .
