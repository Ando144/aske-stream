name: Android app

# Builds the signed APK.
#  - Push a tag like v0.3.0  -> publishes a GitHub Release with the APK
#    (the app finds it there and offers the update to everyone).
#  - "Run workflow" by hand -> builds the APK and keeps it as a downloadable
#    artifact for testing, without publishing anything.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    name: Build signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - run: npm ci

      - name: Version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $VERSION"
            exit 1
          fi

      - name: Restore the signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 is missing (see docs/android.md)"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: npm run apk -w @aske/mobile -- --no-daemon

      - name: Verify the signatures and name the files
        run: |
          OUT=apps/mobile/android/app/build/outputs/apk/release
          V=${{ steps.version.outputs.version }}
          SIGNER="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          mkdir -p out
          # 64-bit ARM: nearly every phone. armv7: older 32-bit phones.
          cp "$OUT/app-arm64-v8a-release.apk" "out/aske-stream-$V.apk"
          cp "$OUT/app-armeabi-v7a-release.apk" "out/aske-stream-$V-armv7.apk"
          for apk in out/*.apk; do "$SIGNER" verify --print-certs "$apk" | head -2; done
          rm -f "$RUNNER_TEMP/release.keystore"

      - name: Keep the APK (manual runs)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: aske-stream-${{ steps.version.outputs.version }}-apks
          path: out/*.apk
          retention-days: 14

      - name: Publish the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=${{ steps.version.outputs.version }}
          # The 64-bit APK goes first: it is the one most people need.
          gh release create "$GITHUB_REF_NAME" "out/aske-stream-$V.apk" "out/aske-stream-$V-armv7.apk" \
            --title "Aske Stream ${{ steps.version.outputs.version }}" \
            --notes-file docs/releases/v${{ steps.version.outputs.version }}.md
